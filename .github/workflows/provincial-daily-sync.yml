name: Provincial daily report sync
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provincial-report-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.PROVINCIAL_GOOGLE_SERVICE_ACCOUNT_JSON }}
      REQUIRED_REPORT_METRICS: ${{ vars.REQUIRED_REPORT_METRICS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify configured credentials
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || [ -z "$REQUIRED_REPORT_METRICS" ]; then
            echo "::error::Configure PROVINCIAL_GOOGLE_SERVICE_ACCOUNT_JSON secret and REQUIRED_REPORT_METRICS repository variable before enabling sync"
            exit 1
          fi
      - name: Sync completed report
        run: node scripts/provincial-daily-sync.mjs
