name: Validate manager permissions branch
on:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/manager-permissions-ci.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
