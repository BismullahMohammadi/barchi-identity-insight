name: Validate manager permissions branch
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/manager-permissions-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/manager-permissions-ci.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The repository-wide lint baseline contains legacy formatting violations outside this RBAC change.
      - run: bunx eslint src/lib/dashboard-access.ts src/lib/dashboard-permissions.server.ts src/lib/dashboard-permissions.server.test.ts
      - run: bunx eslint --rule '{"prettier/prettier":"off"}' src/lib/sheets.functions.ts src/routes/_authenticated/dashboard.index.tsx
      - run: bun run test
      - run: bun run build
