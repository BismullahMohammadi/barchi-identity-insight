name: Validate dashboard
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify UI/UX Pro Max skill
        run: |
          python3 .agents/skills/ui-ux-pro-max/scripts/search.py "dashboard keyboard navigation" --domain ux
          python3 .agents/skills/ui-ux-pro-max/scripts/search.py "responsive dashboard table" --stack react
          python3 .agents/skills/ui-ux-pro-max/scripts/search.py "government management dashboard" --design-system -p "Barchi Identity Insight"
      - name: Type check
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
